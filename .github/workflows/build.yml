name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: grep -E "targetSdk|compileSdk" android/variables.gradle
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease
      - name: Sign bundle
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          rm upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: tafaaul-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
