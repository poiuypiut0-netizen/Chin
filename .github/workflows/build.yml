name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KS_B64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KS_ALIAS" ] && missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install --legacy-peer-deps
      

      - name: Native config (Firebase file, AdMob id, version)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set, Google sign-in will not work"
          fi
          APPID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|APPLICATION_ID" android/app/build.gradle android/app/src/main/AndroidManifest.xml || true

      - run: npx cap sync android
      - name: Show registered plugins
        run: |
          ls node_modules/@capacitor-firebase node_modules/@capacitor-community 2>&1 || true
          cat android/app/src/main/assets/capacitor.plugins.json || true
      - run: grep -E "targetSdk|compileSdk|minSdk" android/variables.gradle

      - run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease assembleRelease

      - name: Sign bundle and APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks upload.jks --ks-pass pass:"$KS_PASS" --ks-key-alias "$KS_ALIAS" --out app-release.apk aligned.apk
          "$BT/apksigner" verify app-release.apk
          rm -f upload.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tafaaul-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: tafaaul-apk
          path: app-release.apk

      - name: Show key fingerprint
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > k.jks
          keytool -list -v -keystore k.jks -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -E "SHA1|SHA256"
          rm -f k.jks
