
name: Build AAB and APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Save Firebase configuration
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > /tmp/google-services.json
          elif [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
          else
            echo "::error::Firebase configuration is missing"
            exit 1
          fi

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KS_B64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KS_ALIAS" ] && missing="$missing KEY_ALIAS"

          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create fresh Android project
        run: |
          rm -rf android
          npx cap add android
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Firebase Google Sign-In
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          variables = Path("android/variables.gradle")

          text = root.read_text()
          dependency = "classpath 'com.google.gms:google-services:4.4.2'"

          if dependency not in text:
              match = re.search(r'(?m)^(\s*)dependencies\s*\{', text)
              if not match:
                  raise SystemExit("Root Gradle dependencies block not found")
              pos = match.end()
              text = text[:pos] + "\n        " + dependency + text[pos:]
              root.write_text(text)

          app_text = app.read_text()

          if "com.google.gms.google-services" not in app_text:
              app.write_text(
                  app_text.rstrip()
                  + "\n\napply plugin: 'com.google.gms.google-services'\n"
              )

          v = variables.read_text()

          additions = [
              "rgcfaIncludeGoogle = true",
              "androidxCredentialsVersion = '1.3.0'"
          ]

          for item in additions:
              if item.split(" = ")[0] not in v:
                  v = re.sub(
                      r'(?m)^ext\s*\{',
                      'ext {\n    ' + item,
                      v,
                      count=1
                  )

          variables.write_text(v)

          print("Firebase Gradle configuration completed")
          PY

      - name: Configure AdMob and version
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          import xml.etree.ElementTree as ET

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()

          ns = "{http://schemas.android.com/apk/res/android}"

          app = root.find("application")

          if app is None:
              raise SystemExit("Android application element missing")

          app_id = (
              os.environ.get("ADMOB_APP_ID")
              or "ca-app-pub-3940256099942544~3347511713"
          )

          item = next(
              (
                  x for x in app.findall("meta-data")
                  if x.get(ns + "name")
                  == "com.google.android.gms.ads.APPLICATION_ID"
              ),
              None
          )

          if item is None:
              item = ET.SubElement(app, "meta-data")

          item.set(
              ns + "name",
              "com.google.android.gms.ads.APPLICATION_ID"
          )

          item.set(ns + "value", app_id)

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          text, count = re.subn(
              r'versionCode\s+\d+',
              'versionCode ' + os.environ.get("GITHUB_RUN_NUMBER", "1"),
              text,
              count=1
          )

          if count == 0:
              raise SystemExit("versionCode not found in app/build.gradle")

          gradle.write_text(text)

          print("Manifest and AdMob configuration completed")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android files
        run: |
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          grep -E "rgcfaIncludeGoogle|androidxCredentialsVersion" android/variables.gradle
          ls -la android/app

      - name: Build APK and AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Sign APK and AAB
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload.jks \
            -storepass "$KS_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KS_ALIAS"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)

          test -n "$UNSIGNED"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk

          "$BT/apksigner" sign \
            --ks upload.jks \
            --ks-pass pass:"$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --out app-release.apk aligned.apk

          "$BT/apksigner" verify app-release.apk

          rm -f upload.jks aligned.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tafaaul-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tafaaul-apk
          path: app-release.apk

      - name: Show signing fingerprints
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > k.jks

          keytool -list -v -keystore k.jks \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" | grep -E "SHA1|SHA256"

          rm -f k.jks
          
